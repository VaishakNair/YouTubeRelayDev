<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>YouTube Relay Fix</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #player-container {
        width: 100%;
        height: 100%;
        display: flex;
      }
      #player-container iframe {
        width: 100% !important;
        height: 100% !important;
        border: none;
        flex-grow: 1;
      }
    </style>
  </head>
  <body>
    <div id="player-container"></div>

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const videoId = urlParams.get("v");
      const start = urlParams.get("start") || urlParams.get("t");
      const autoplay = urlParams.get("autoplay");
      const container = document.getElementById("player-container");
      // let isPlayerReady = false;

      if (videoId && /^[a-zA-Z0-9_-]{11}$/.test(videoId)) {
        const iframe = document.createElement("iframe");
        iframe.id = "yt-player-embed";
        const currentOrigin = window.location.origin;

        // 1. Include enablejsapi=1 so YouTube player listens for API postMessages
        let embedUrl = `https://www.youtube.com/embed/${videoId}?enablejsapi=1&origin=${encodeURIComponent(currentOrigin)}`;
        if (start) embedUrl += `&start=${encodeURIComponent(start)}`;
        if (autoplay) embedUrl += `&autoplay=${encodeURIComponent(autoplay)}`;

        iframe.src = embedUrl;
        iframe.title = "YouTube video player";
        iframe.setAttribute(
          "referrerpolicy",
          "strict-origin-when-cross-origin",
        );
        iframe.allow =
          "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
        iframe.allowFullscreen = true;

        container.appendChild(iframe);

        // Forward postMessages:
        // - From parent extension window down to inner YouTube embed iframe
        // - From inner YouTube embed iframe up to parent extension window
        window.addEventListener("message", (event) => {
          console.log(
            `Message event inside the yt-player iframe: ${JSON.stringify(event.data)}`,
          );
          if (event.source === iframe.contentWindow) {
            // Message is from YouTube's iframe
            // if (isInitialDelivery(iframe, event)) return;

            if (window.parent && window.parent !== window) {
              window.parent.postMessage(event.data, "*");
            }
          } else {
            // Message is from the parent extension window
            if (iframe.contentWindow) {
              iframe.contentWindow.postMessage(event.data, "*");
            }
          }
        });
      } else {
        container.innerHTML =
          "<p style='color:white; text-align:center; padding-top:20px;'>Invalid Video ID</p>";
      }

      // function isInitialDelivery(iframe, event) {

      //     if (rawData.event === "initialDelivery") {

      //       return true;
      //     }

      //     console.error("Failed to parse event data:", e);
      //   }
      //   return false;

    </script>
  </body>
</html>
