<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>YouTube Relay Fix</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #player-container {
        width: 100%;
        height: 100%;
        display: flex;
      }
      #player-container iframe {
        width: 100% !important;
        height: 100% !important;
        border: none;
        flex-grow: 1;
      }
    </style>
  </head>
  <body>
    <div id="player-container"></div>

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const videoId = urlParams.get("v");
      const start = urlParams.get("start") || urlParams.get("t");
      const autoplay = urlParams.get("autoplay");
      const container = document.getElementById("player-container");

      if (videoId && /^[a-zA-Z0-9_-]{11}$/.test(videoId)) {
        const iframe = document.createElement("iframe");
        iframe.id = "yt-player-embed";
        const currentOrigin = window.location.origin;

        // 1. Include enablejsapi=1 so YouTube player listens for API postMessages
        let embedUrl = `https://www.youtube.com/embed/${videoId}?enablejsapi=1&origin=${encodeURIComponent(currentOrigin)}`;
        if (start) embedUrl += `&start=${encodeURIComponent(start)}`;
        if (autoplay) embedUrl += `&autoplay=${encodeURIComponent(autoplay)}`;

        iframe.src = embedUrl;
        iframe.title = "YouTube video player";
        iframe.setAttribute(
          "referrerpolicy",
          "strict-origin-when-cross-origin",
        );
        iframe.allow =
          "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
        iframe.allowFullscreen = true;

        container.appendChild(iframe);

        // 2. Forward postMessages received from extension window down to inner YouTube embed iframe
        window.addEventListener("message", (event) => {
          if (iframe.contentWindow) {
            iframe.contentWindow.postMessage(event.data, "*");
          }
        });

        // This code loads the IFrame Player API code asynchronously.
        var tag = document.createElement("script");
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName("script")[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        let player;
        function onYouTubeIframeAPIReady() {
          player = new YT.Player("yt-player-embed", {
            playerVars: {
              playsinline: 1,
            },
            events: {
              onStateChange: onPlayerStateChange,
            },
          });
        }
      } else {
        container.innerHTML =
          "<p style='color:white; text-align:center; padding-top:20px;'>Invalid Video ID</p>";
      }

      // The API calls this function when the player's state changes.
      // The function indicates that when playing a video (state=1),
      // the player should play for six seconds and then stop.
      function onPlayerStateChange(event) {
        console.log("Player State: " + JSON.stringify(event));
        window.postMessage(event, "*");
        // if (event.data == YT.PlayerState.PLAYING && !done) {
        //   setTimeout(stopVideo, 6000);
        //   done = true;
        // }
      }
    </script>
  </body>
</html>
